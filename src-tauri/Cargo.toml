[package]
name = "pdfkaro"
version = "0.1.0"
description = "PDFKaro Desktop Application"
authors = ["PDFKaro"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-localhost = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
